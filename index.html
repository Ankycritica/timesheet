<script>
// local browser storage shim (same API as the artifact version)
window.storage={
  async get(k){const v=localStorage.getItem(k); if(v===null) throw new Error('missing'); return {key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v); return {key:k,value:v};},
  async delete(k){localStorage.removeItem(k); return {key:k,deleted:true};},
  async list(p){return {keys:Object.keys(localStorage).filter(k=>!p||k.startsWith(p))};}
};
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#EEF1F3; --card:#FFFFFF; --ink:#18242E; --muted:#6B7C88;
    --line:#D3DBE1; --blue:#25627F; --blue-soft:#E4EEF3; --warm:#B4531F; --ok:#2E6B4F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 20px 64px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.02em}
  .who{color:var(--muted);margin-top:2px}
  .who input{border:none;background:transparent;font:inherit;color:var(--ink);border-bottom:1px dashed var(--line);padding:1px 2px}
  .weeknav{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  .weeknav button{border:none;background:transparent;font-size:17px;cursor:pointer;color:var(--blue);padding:2px 9px;border-radius:6px}
  .weeknav button:hover{background:var(--blue-soft)}
  .wlabel{font-family:'IBM Plex Mono',monospace;font-size:13px;min-width:190px;text-align:center}
  .wlabel b{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat span{display:block;color:var(--muted);font-size:12px}
  .stat strong{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:500;letter-spacing:-.02em}
  .stat.ot strong{color:var(--warm)}
  .bar{height:5px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);width:0}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{font-size:11.5px;text-transform:none;color:var(--muted);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#F7F9FA}
  td{padding:7px 12px;border-bottom:1px solid #E9EEF1;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.weekend td{background:#FBFCFD}
  tr.today td{box-shadow:inset 3px 0 0 var(--blue)}
  .day{font-weight:500}
  .day em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
  input[type=time]{font:inherit;font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid transparent;background:#F4F7F9;
    border-radius:7px;padding:5px 7px;color:var(--ink);width:110px}
  input[type=time]:hover{border-color:var(--line)}
  input[type=time]:focus{outline:none;border-color:var(--blue);background:#fff}
  .hrs{font-family:'IBM Plex Mono',monospace;font-weight:500;text-align:right}
  .hrs.zero{color:var(--muted)}
  .off{font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
  .off input{vertical-align:-1px;accent-color:var(--blue)}
  textarea{width:100%;min-height:76px;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;resize:vertical;background:var(--card)}
  .row2{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-top:16px}
  .notes{flex:1 1 420px}
  .notes label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .actions{display:flex;flex-direction:column;gap:8px;min-width:210px}
  .btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 14px;text-align:left}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.primary:hover{background:#1C4E66;color:#fff}
  .banner{background:#FFF6E8;border:1px solid #E8CFA8;color:#7A4E14;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:none}
  .banner button{margin-left:10px;font:inherit;border:1px solid #E8CFA8;background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer}
  .foot{margin-top:14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .saved{color:var(--ok)}
  @media(max-width:720px){
    .stats{grid-template-columns:repeat(2,1fr)}
    table,thead,tbody,tr,td{display:block}
    thead{display:none}
    tr{border-bottom:1px solid var(--line);padding:8px 4px}
    td{border:none;display:inline-block;padding:4px 8px}
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Timesheet</h1>
      <div class="who">Employee: <input id="name" value="Ankit Dongare" size="16"></div>
    </div>
    <div class="weeknav">
      <button id="prev" title="Previous week">‹</button>
      <div class="wlabel"><span id="wnum">Week —</span><b id="wrange"></b></div>
      <button id="next" title="Next week">›</button>
      <button id="thisweek" style="font-size:12px" title="Jump to current week">today</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>
  <div class="stats">
    <div class="stat"><span>Total hours</span><strong id="total">0.00</strong><div class="bar"><i id="bar"></i></div></div>
    <div class="stat"><span>Regular</span><strong id="reg">0.00</strong></div>
    <div class="stat ot"><span>Overtime</span><strong id="ot">0.00</strong></div>
    <div class="stat"><span>Days logged</span><strong id="days">0</strong></div>
  </div>

  <table>
    <thead><tr>
      <th style="width:150px">Day</th><th>Time in</th><th>Lunch start</th><th>Lunch end</th><th>Time out</th>
      <th style="width:90px;text-align:right">Hours</th><th style="width:70px"></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="row2">
    <div class="notes">
      <label for="comment">What you worked on this week (goes in the Comments cell)</label>
      <textarea id="comment" placeholder="e.g. CIP performance test"></textarea>
    </div>
    <div class="actions">
      <button class="btn primary" id="export">Download this week (.xlsx)</button>
      <button class="btn" id="exportAll">Download all weeks (.xlsx)</button>
      <button class="btn" id="copyPrev">Copy last week's times</button>
      <button class="btn" id="fillWeekday">Fill Mon–Fri with 9–6</button>
      <button class="btn" id="import">Import from Excel file</button>
      <input type="file" id="file" accept=".xlsx" hidden>
      <button class="btn" id="share">Copy share link for this week</button>
      <button class="btn" id="clear">Clear this week</button>
    </div>
  </div>

  <div class="foot">
    <span id="status">Loading…</span>
    <span>Saves automatically. Default day: 9:00 in, 12:30–13:30 lunch, 18:00 out.</span>
  </div>
</div>

<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DEF={in:'09:00',ls:'12:30',le:'13:30',out:'18:00'};
let monday, week={}, saveTimer=null;

// ---------- date helpers ----------
const iso=d=>d.toISOString().slice(0,10);
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-k);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return {week:Math.ceil(((t-y)/864e5+1)/7),year:t.getUTCFullYear()};}
const fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
const key=m=>'ts:'+iso(m);

// ---------- model ----------
function blankWeek(m){return {start:iso(m),comment:'',days:DAYS.map(()=>({in:'',ls:'',le:'',out:'',off:false}))};}
function hours(d){
  if(d.off||!d.in||!d.out) return 0;
  const t=s=>{const[a,b]=s.split(':').map(Number);return a*60+b;};
  let mins=t(d.out)-t(d.in); if(mins<0) mins+=1440;
  if(d.ls&&d.le){let l=t(d.le)-t(d.ls); if(l<0)l+=1440; mins-=l;}
  return Math.max(0,mins)/60;
}
const totalOf=w=>w.days.reduce((s,d)=>s+hours(d),0);

// ---------- storage ----------
async function load(m){
  try{const r=await window.storage.get(key(m)); return r?JSON.parse(r.value):blankWeek(m);}
  catch(e){return blankWeek(m);}
}
async function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await window.storage.set(key(monday),JSON.stringify(week));
      await window.storage.set('ts:name',document.getElementById('name').value);
      flag('Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),true);
    }catch(e){flag('Could not save — your changes are only on screen',false);}
  },350);
}
function flag(msg,ok){const s=document.getElementById('status');s.textContent=msg;s.className=ok?'saved':'';}

// ---------- render ----------
function render(){
  const {week:wn,year}=isoWeek(monday);
  document.getElementById('wnum').textContent='Week '+wn+' · '+year;
  document.getElementById('wrange').textContent=fmt(monday)+' – '+fmt(addDays(monday,6));
  const today=iso(new Date());
  const tb=document.getElementById('rows'); tb.innerHTML='';
  week.days.forEach((d,i)=>{
    const date=addDays(monday,i), h=hours(d);
    const tr=document.createElement('tr');
    if(i>4) tr.className='weekend';
    if(iso(date)===today) tr.className+=' today';
    tr.innerHTML=
      `<td class="day">${DAYS[i]}<em>${fmt(date)}</em></td>`+
      ['in','ls','le','out'].map(f=>`<td><input type="time" data-i="${i}" data-f="${f}" value="${d[f]}" ${d.off?'disabled':''}></td>`).join('')+
      `<td class="hrs ${h?'':'zero'}">${h?h.toFixed(2):'—'}</td>`+
      `<td><label class="off"><input type="checkbox" data-i="${i}" data-f="off" ${d.off?'checked':''}> off</label></td>`;
    tb.appendChild(tr);
  });
  const t=totalOf(week), ot=Math.max(0,t-40);
  document.getElementById('total').textContent=t.toFixed(2);
  document.getElementById('reg').textContent=Math.min(t,40).toFixed(2);
  document.getElementById('ot').textContent=ot.toFixed(2);
  document.getElementById('days').textContent=week.days.filter(d=>hours(d)>0).length;
  document.getElementById('bar').style.width=Math.min(100,t/40*100)+'%';
  document.getElementById('comment').value=week.comment||'';
}

document.getElementById('rows').addEventListener('input',e=>{
  const i=+e.target.dataset.i, f=e.target.dataset.f; if(f===undefined) return;
  if(f==='off'){week.days[i].off=e.target.checked;} else {week.days[i][f]=e.target.value;}
  render(); save();
});
document.getElementById('comment').addEventListener('input',e=>{week.comment=e.target.value;save();});
document.getElementById('name').addEventListener('input',save);

async function go(m){monday=m;week=await load(m);render();}
document.getElementById('prev').onclick=()=>go(addDays(monday,-7));
document.getElementById('next').onclick=()=>go(addDays(monday,7));
document.getElementById('thisweek').onclick=()=>go(mondayOf(new Date()));
document.getElementById('clear').onclick=()=>{week=blankWeek(monday);render();save();};
document.getElementById('fillWeekday').onclick=()=>{
  week.days.forEach((d,i)=>{ if(i<5&&!d.off) Object.assign(d,DEF); });
  render(); save();
};
document.getElementById('copyPrev').onclick=async()=>{
  const p=await load(addDays(monday,-7));
  week.days=p.days.map(d=>({...d})); week.comment=week.comment||p.comment;
  render(); save();
};

// ---------- export ----------
function sheetFor(w,m,name){
  const rows=[['WeekDay:','Week Start:','Time In:','Lunch Break Start','Lunch Break End:','Time Out','Hours Worked:','Comments']];
  w.days.forEach((d,i)=>{
    const t=x=>d.off?'OFF':(x||'');
    rows.push([DAYS[i],fmtDate(addDays(m,i)),t(d.in),t(d.ls),t(d.le),t(d.out),+hours(d).toFixed(2),i===0?(w.comment||''):'']);
  });
  const tot=totalOf(w);
  rows.push([],[],['Employee Name:','Hourly Rate: '],[name,0],[],[],
    ['Total hours:',+tot.toFixed(2)],['Overtime Hours:',+Math.max(0,tot-40).toFixed(2)]);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:12},{wch:11},{wch:17},{wch:17},{wch:11},{wch:13},{wch:60}];
  return ws;
}
const fmtDate=d=>d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'});

document.getElementById('export').onclick=()=>{
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheetFor(week,monday,document.getElementById('name').value),'Week '+isoWeek(monday).week);
  XLSX.writeFile(wb,'Ankit_TimeSheet_W'+isoWeek(monday).week+'.xlsx');
};
document.getElementById('exportAll').onclick=async()=>{
  try{
    const list=await window.storage.list('ts:');
    const keys=(list?.keys||[]).filter(k=>/^ts:\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();
    if(!keys.length) return flag('Nothing to export yet',false);
    const wb=XLSX.utils.book_new();
    for(const k of keys){
      const r=await window.storage.get(k); if(!r) continue;
      const w=JSON.parse(r.value), m=new Date(k.slice(3)+'T00:00:00');
      XLSX.utils.book_append_sheet(wb,sheetFor(w,m,document.getElementById('name').value),'Week '+isoWeek(m).week);
    }
    XLSX.writeFile(wb,'Ankit_TimeSheet.xlsx');
  }catch(e){flag('Export failed — try downloading this week only',false);}
};



// ---------- import existing workbook ----------
document.getElementById('import').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
  const hm=v=>{ if(v instanceof Date) return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0'); return ''; };
  let n=0;
  for(const nm of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,cellDates:true});
    const first=a[1]; if(!first||!(first[1] instanceof Date)) continue;
    const d=first[1]; const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    m.setDate(m.getDate()-((m.getDay()+6)%7));
    const w={start:iso(m),comment:'',days:[]};
    for(let i=1;i<=7;i++){
      const r=a[i]||[];
      const off=typeof r[2]==='string'&&r[2].trim()!=='';
      w.days.push({in:hm(r[2]),ls:hm(r[3]),le:hm(r[4]),out:hm(r[5]),off:off});
      if(r[7]&&!w.comment) w.comment=String(r[7]);
    }
    while(w.days.length<7) w.days.push({in:'',ls:'',le:'',out:'',off:false});
    await window.storage.set('ts:'+iso(m),JSON.stringify(w)); n++;
  }
  flag('Imported '+n+' weeks',true);
  await go(monday);
};

// ---------- share ----------
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s))));
document.getElementById('share').onclick=async()=>{
  const url=location.origin+location.pathname+'#w='+enc({m:iso(monday),w:week,n:document.getElementById('name').value});
  try{await navigator.clipboard.writeText(url);flag('Share link copied to clipboard',true);}
  catch(e){prompt('Copy this link:',url);}
};
function openShared(){
  const h=location.hash;
  if(!h.startsWith('#w=')) return false;
  try{
    const p=dec(h.slice(3));
    monday=new Date(p.m+'T00:00:00'); week=p.w;
    if(p.n) document.getElementById('name').value=p.n;
    render();
    const b=document.getElementById('banner');
    b.style.display='block';
    b.innerHTML='Viewing a shared week from '+(p.n||'someone')+'. Edits stay in your browser only.';
    const btn=document.createElement('button');
    btn.textContent='Save to my timesheet';
    btn.onclick=async()=>{await save();b.style.display='none';history.replaceState(null,'',location.pathname);};
    b.appendChild(btn);
    return true;
  }catch(e){return false;}
}

// ---------- boot ----------
(async()=>{
  try{const n=await window.storage.get('ts:name'); if(n) document.getElementById('name').value=n.value;}catch(e){}
  if(!openShared()) await go(mondayOf(new Date()));
  flag('Ready',false);
})();
</script>
